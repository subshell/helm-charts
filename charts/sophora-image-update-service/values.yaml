image:
  repository: container.subshell.com/sophora/sophora-image-update-service
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: sophora-image-update-service

javaOptions: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=80.0 -XX:+ExitOnOutOfMemoryError -XX:+PerfDisableSharedMem"

timeZone: "Europe/Berlin"

sophora:
  authentication:
    secret:
      name: ""
      passwordKey: "password"
      usernameKey: "username"

  # Represents the application.yml of image-update-service:
  configuration:
    sophora:
      client:
        server-connection:
          urls: [ ]
          username: # in secret
          password: # in secret
      image-service:
        s3-image-store:
          host: ""
          access-key-id: ${S3_ACCESS_KEY_ID}
          secret-access-key: ${S3_SECRET_ACCESS_KEY}
          bucket-name: ""
          create-bucket: false
        image-update-service: {}

s3:
  secret:
    name: ""
    accessKeyIdKey: "accessKeyId"
    secretAccessKeyKey: "secretAccessKey"

service:
  type: ClusterIP
  ClusterIP:
  httpPort: 8090

serviceAccount:
  create: false

serviceMonitor:
  enabled: false
  interval: 10s
  path: /actuator/prometheus

resources:
  requests:
    memory: "2G"
    cpu: "2"
  limits:
    memory: "2G"
podAnnotations: {}

## @section Probes
##

# startupProbe.timeoutSeconds Number of seconds after which the probe times out. Defaults to 1 second.
startupProbe:
  httpGet:
    # startupProbe.httpGet.path Path to access on the HTTP server.
    path: /actuator/health/liveness
    # startupProbe.httpGet.port Name or number of the port to access on the container.
    port: http
  # startupProbe.failureThreshold Minimum consecutive failures for the probe to be considered failed after having succeeded.
  failureThreshold: 60 # * 2s period = 2 minutes
  # startupProbe.periodSeconds How often (in seconds) to perform the probe.
  periodSeconds: 2

# livenessProbe.initialDelaySeconds Number of seconds after the container has started before liveness probes are initiated.
# livenessProbe.periodSeconds How often (in seconds) to perform the probe. Default to 10 seconds.
# livenessProbe.timeoutSeconds Number of seconds after which the probe times out. Defaults to 1 second.
livenessProbe:
  httpGet:
    # livenessProbe.httpGet.path Path to access on the HTTP server.
    path: /actuator/health/liveness
    # livenessProbe.httpGet.port Name or number of the port to access on the container.
    port: http
  # livenessProbe.failureThreshold Minimum consecutive failures for the probe to be considered failed after having succeeded.
  failureThreshold: 12 # * 10s period = 2 minutes

# readinessProbe.failureThreshold Minimum consecutive failures for the probe to be considered failed after having succeeded. Defaults to 3.
# readinessProbe.periodSeconds How often (in seconds) to perform the probe. Default to 10 seconds.
# readinessProbe.timeoutSeconds Number of seconds after which the probe times out. Defaults to 1 second.
readinessProbe:
  httpGet:
    # readinessProbe.httpGet.path Path to access on the HTTP server.
    path: /actuator/health/readiness
    # readinessProbe.httpGet.port Name or number of the port to access on the container.
    port: http

# extraDeploy is a list of full Kubernetes manifests that will be rendered additionally by this chart
extraDeploy: []
