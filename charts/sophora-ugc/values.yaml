replicaCount: 1

imagePullSecrets: []

javaOptions: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=80.0 -XX:+ExitOnOutOfMemoryError -XX:+PerfDisableSharedMem"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

service:
  annotations: {}
  management:
    clusterIP: None
  webapp:
    type: ClusterIP
    loadBalancerIP:

ingress:
  enabled: false
  ingressClassName: nginx
  tls:
  hosts:
  annotations: {}

# httpRoutes Map of HTTPRoute resources (Gateway API) to create.
# The map key is used as a suffix for the resource name, e.g. "web" -> "<fullname>-web".
httpRoutes: {}
  # web:
  #   # httpRoutes.web.parentRefs References to the Gateway resources that the HTTPRoute should attach to
  #   parentRefs:
  #     - name: my-gateway
  #       namespace: gateway-namespace
  #   # httpRoutes.web.hostnames Array with hostnames used for the HTTPRoute
  #   hostnames:
  #     - "my-service.example.com"
  #   # httpRoutes.web.matches Optional array of HTTPRouteMatch objects for matching HTTP requests
  #   matches:
  #     - path:
  #         type: PathPrefix
  #         value: /
  #   # httpRoutes.web.filters Optional array of HTTPRouteFilter objects for modifying requests/responses
  #   filters:
  #     - type: RequestHeaderModifier
  #       requestHeaderModifier:
  #         set:
  #           - name: X-Custom-Header
  #             value: custom-value
  #   # httpRoutes.web.annotations annotations for the HTTPRoute
  #   annotations: {}

# extraDeploy Additional Kubernetes resources to deploy with this release
extraDeploy: []

startupProbe:
  failureThreshold: 15
  initialDelaySeconds: 5
  timeoutSeconds: 30
  periodSeconds: 1

readinessProbe:
  failureThreshold: 5
  initialDelaySeconds: 5
  timeoutSeconds: 5
  periodSeconds: 5

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 15
  timeoutSeconds: 10
  periodSeconds: 60

authentication:
  secret:
    server:
      name: secret-name
      usernameKey:
      passwordKey:
    database:
      name: secret-name
      usernameKey:
      passwordKey:
    binarystore:
      name: secret-name
      accessKeyKey: binarystore-access-key
      secretIdKey: binarystore-secret-id
    s3bucket:
      name: s3bucket-secret
      accessKeyKey: s3bucket-access-key
      secretIdKey: s3bucket-secret-id

ugc:
  image:
    repository: container.subshell.com/sophora/ugc
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  hostname: ""
  nameOverride: ""
  fullnameOverride: ""
  logback: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration scan="true">
        <jmxConfigurator />
        <!-- Propagate level settings to java.util.logging. -->
        <contextListener class="ch.qos.logback.classic.jul.LevelChangePropagator"/>
        <appender name="logfile" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <File>/logs/ugc-webapp.log</File>
            <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
                <fileNamePattern>/logs/ugc.%d{yyyy-MM-dd}.log</fileNamePattern>
                <maxHistory>7</maxHistory>
            </rollingPolicy>
            <encoder>
                <pattern>[%d{"yyyy-MM-dd HH:mm:ss.SSSX",UTC}, %-5p] [%t] [%X{ID}] %.30c:%L: %m%n</pattern>
            </encoder>
        </appender>
        <appender name="errorLog" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <filter class="ch.qos.logback.classic.filter.ThresholdFilter">
                <level>ERROR</level>
            </filter>
            <File>/logs/error.log</File>
            <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
                <fileNamePattern>/logs/error.%d{yyyy-MM-dd}.log</fileNamePattern>
                <maxHistory>7</maxHistory>
            </rollingPolicy>
            <encoder>
                <pattern>[%d{"yyyy-MM-dd HH:mm:ss.SSSX",UTC}, %-5p] [%t] [%X{ID}] %.40c:%L: %m%n</pattern>
            </encoder>
        </appender>
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{HH:mm:ss.SSS} [%thread] %-5level [%X{ID}] %logger{36} - %msg%n</pattern>
            </encoder>
        </appender>
        <logger name="com.subshell.sophora.ugc" level="INFO" />
        <root level="WARN">
            <appender-ref ref="STDOUT" />
            <appender-ref ref="logfile" />
            <appender-ref ref="errorLog" />
        </root>
    </configuration>
  config:
    sophora-server:
      host:
    database:
      url:
    management:
      endpoints.web.exposure.include: info, health, prometheus

      endpoint:
        prometheus:
          enabled: true
        health:
          show-details: always
          show-components: always

  extraContainers: []
  extraInitContainers: []

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  healthCheck:
    # Which port to use for Kubernetes liveness/readiness probes
    # Options: "webapp" or "management"
    port: webapp

  managementService:
    enabled: true # deploy a management service
    port: 1694 # must match Spring's management.server.port property
  # ugc.serviceMonitor.enabled Whether the serviceMonitor resource should be deployed
  # ugc.serviceMonitor.target: Choose which service the ServiceMonitor should select, "webapp" or "management"
  # ugc.serviceMonitor.interval Prometheus scrape interval
  # ugc.serviceMonitor.path HTTP path prometheus should use to scrape the application's metrics
  serviceMonitor:
    enabled: false
    target: webapp # or management
    interval: 10s
    path: "/actuator/prometheus"
  gcp:
    # ugc.gcp.enabled Whether GCP resources should be enabled or not
    enabled: true
    # ugc.gcp.healthCheck.enabled Whether the GCP Health Check resource should be deployed
    # ugc.gcp.healthCheck.port Number of the port used for the GCP Health Check
    # ugc.gcp.healthCheck.portName Name of the port used for the GCP Health Check
    # ugc.gcp.healthCheck.path HTTP path GCP should use to check the application's health
    # ugc.gcp.healthCheck.logging Whether to enable access logging for GCP Health Check requests
    healthCheck:
      enabled: false
      logging: false
      port: 8080
      path: "/actuator/health/readiness"
    # ugc.gcp.backendPolicy.enabled Whether the GCP Backend Policy resource should be deployed
    # ugc.gcp.backendPolicy.logging.enabled Whether to enable access logging for GCP Backend Policy requests
    # ugc.gcp.backendPolicy.logging.sampleRate Sample rate for GCP Backend Policy logging (1-1000000)
    # ugc.gcp.backendPolicy.sessionAffinity Type of session affinity for GCP Backend Policy (NONE, GENERATED_COOKIE, HTTP_COOKIE)
    # ugc.gcp.backendPolicy.cookieTtlSec TTL for session affinity cookies in seconds (only applicable for GENERATED_COOKIE and HTTP_COOKIE)
    # ugc.gcp.backendPolicy.connectionDraining.drainingTimeoutSec Timeout for GCP Backend Policy connection draining in seconds
    # ugc.gcp.backendPolicy.timeoutSec Timeout for GCP Backend Policy requests in seconds
    # ugc.gcp.backendPolicy.securityPolicy Name of the GCP Cloud Armor Security Policy to apply to the Backend Policy
    # ugc.gcp.backendPolicy.iap.enabled Whether to enable Identity-Aware Proxy (IAP) for the GCP Backend Policy
    # ugc.gcp.backendPolicy.iap.oauth2ClientSecretName Name of the Kubernetes secret containing the OAuth2 client secret for IAP
    # ugc.gcp.backendPolicy.iap.clientID OAuth2 client ID for IAP
    backendPolicy:
      enabled: false
    #  logging:
    #    enabled: false
    #    sampleRate: 1000000
    #  sessionAffinity:
    #    type: NONE
    #    cookieTtlSec: 0
    #  connectionDraining:
    #    drainingTimeoutSec: 0
    #  timeoutSec: 30
    #  securityPolicy: ""
    #  iap:
    #    enabled: false
    #    oauth2ClientSecretName: ""
    #    clientID: ""

ugcMultimedia:
  enabled: false
  image:
    repository: container.subshell.com/sophora/ugc-multimedia
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  name: "ugc-multimedia"
  fullnameOverride: ""
  binariesStorage:
    size: 1G
    storageClass: standard
  hostname:
  logback: |
    <?xml version="1.0" encoding="UTF-8"?>

    <configuration scan="true" scanPeriod="60 seconds">
    <jmxConfigurator />

    <!-- Propagate level settings to java.util.logging. -->
    <contextListener class="ch.qos.logback.classic.jul.LevelChangePropagator"/>

    <appender name="logfile" class="ch.qos.logback.core.rolling.RollingFileAppender">
    <File>logs/ugc-multimedia.log</File>
    <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
    <fileNamePattern>logs/ugc-multimedia.%d{yyyy-MM-dd}.log.gz</fileNamePattern>
    <maxHistory>7</maxHistory>
    </rollingPolicy>
    <encoder>
    <pattern>[%d{ISO8601}, %-5p] [%t] [%X{ID}] %.30c:%L: %m%n</pattern>
    </encoder>
    </appender>
    <appender name="errorLog" class="ch.qos.logback.core.rolling.RollingFileAppender">
    <filter class="ch.qos.logback.classic.filter.ThresholdFilter">
    <level>ERROR</level>
    </filter>
    <File>logs/ugc-multimedia-error.log</File>
    <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
    <fileNamePattern>logs/ugc-multimedia-error.%d{yyyy-MM-dd}.log.gz</fileNamePattern>
    <maxHistory>7</maxHistory>
    </rollingPolicy>
    <encoder>
    <pattern>[%d{ISO8601}, %-5p] [%t] [%X{ID}] %.40c:%L: %m%n</pattern>
    </encoder>
    </appender>

    <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
    <encoder>
    <pattern>%d{HH:mm:ss.SSS} [%thread] %-5level [%X{ID}] %logger{36} - %msg%n</pattern>
    </encoder>
    </appender>

    <logger name="com.subshell.sophora.ugc.services" level="DEBUG" />
    <logger name="org.springframework" level="INFO" />

    <root level="INFO">
    <appender-ref ref="logfile" />
    <appender-ref ref="STDOUT" />
    <appender-ref ref="errorLog" />
    </root>
    </configuration>
  config:
    storage:
      type: fs
      fs:
        baseDir: /binaries/
    management:
      endpoints.web.exposure.include: info, health, prometheus

      endpoint:
        prometheus:
          enabled: true
        health:
          show-details: always
          show-components: always

  # serviceMonitor.enabled Whether the serviceMonitor resource should be deployed
  # serviceMonitor.interval Prometheus scrape interval
  # serviceMonitor.path HTTP path prometheus should use to scrape the application's metrics
  serviceMonitor:
    enabled: false
    interval: 10s
    path: "/actuator/prometheus"
  gcp:
    # ugcMultimedia.gcp.enabled Whether GCP resources should be enabled or not
    enabled: true
    # ugcMultimedia.gcp.healthCheck.enabled Whether the GCP Health Check resource should be deployed
    # ugcMultimedia.gcp.healthCheck.port Number of the port used for the GCP Health Check
    # ugcMultimedia.gcp.healthCheck.portName Name of the port used for the GCP Health Check
    # ugcMultimedia.gcp.healthCheck.path HTTP path GCP should use to check the application's health
    # ugcMultimedia.gcp.healthCheck.logging Whether to enable access logging for GCP Health Check requests
    healthCheck:
      enabled: false
      logging: false
      port: 8080
      path: "/actuator/health/readiness"

# Additional environment variables can be defined here
env:

resources:
  requests:
    cpu: "200m"
    memory: "2.5G"
  limits:
    memory: "2.5G"


nodeSelector: {}

tolerations: []

affinity: {}

